name: compile and release

on:
  push:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install pyinstaller

      - name: paths
        shell: python
        run: |
          from pathlib import Path
          p = Path("spoofer.py")
          src = p.read_text(encoding="utf-8")
          old = 'ROOT = Path(__file__).resolve().parent'
          new = 'ROOT = Path(sys.executable).resolve().parent if getattr(sys, "frozen", False) else Path(__file__).resolve().parent'
          assert old in src, "anchor line not found"
          p.write_text(src.replace(old, new), encoding="utf-8")

      - run: pyinstaller --onefile --clean --name kanashi spoofer.py

      - name: release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
        run: |
          tag="${SHA:0:6}"
          gh release delete "$tag" --yes --cleanup-tag 2>/dev/null || true
          gh release create "$tag" dist/kanashi.exe --title "$tag" --latest